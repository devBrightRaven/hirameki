name: Validate Commands

on:
  push:
    paths:
      - "commands/**"
      - "codex/**"
      - "skills/**"
      - "tests/**"
      - ".release.json"
      - "package.json"
      - "VALIDATION.md"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "commands/**"
      - "codex/**"
      - "skills/**"
      - "tests/**"
      - ".release.json"
      - "package.json"
      - "VALIDATION.md"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate release test-chain parity
        run: python -X utf8 tests/validate_release_contract.py

      - name: Run full validation battery
        run: npm test -- --run
